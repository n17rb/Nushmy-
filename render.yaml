# نشر بنقرة واحدة على Render
services:
  - type: web
    name: nashmi
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: SMS_PROVIDER
        value: dev
      - key: OTP_DEV_SHOW   # للمعاينة فقط — احذفه قبل الإطلاق
        value: "1"
      - key: DATABASE_URL
        sync: false   # ضع رابط Neon من لوحة Render
