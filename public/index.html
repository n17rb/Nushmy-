<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">

<meta name="theme-color" content="#A60E35" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C0D10" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/img/logo-mark.png">
<link rel="apple-touch-icon" href="/img/logo-mark.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="preload" href="/img/logo-mark.png" as="image">

    </div>
    <div id="screens"></div>
    <div class="toast-host" id="toasts"></div>

  <script src="/js/icons.js"></script>

  <script src="/js/map.js"></script>

  <script src="/js/push.js"></script>
  <script src="/js/chat.js"></script>
  <script src="/js/call.js"></script>
  <script src="/js/screens/inbox.js"></script>
  <script src="/js/screens/auth.js"></script>
  <script src="/js/screens/home.js"></script>
  <script src="/js/screens/ride.js"></script>
